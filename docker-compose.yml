services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: fxpulse
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - fxpulse_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion-service:
    build:
      context: ./ingestion-service
      dockerfile: Dockerfile

    depends_on:
      db:
        condition: service_healthy

    environment:
      DB_URL: jdbc:postgresql://db:5432/fxpulse
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      FX_API_URL: ${FX_API_URL:-https://api.frankfurter.dev/v2/providers/ecb/rates}
      SERVER_PORT: "8081"

    ports:
      - "127.0.0.1:8081:8081"

    restart: unless-stopped

volumes:
  fxpulse_pgdata:
